[project]
name = "tensorart-api"
version = "0.1.0"
description = "Live, cached, normalised JSON API over the Tensor.Art model catalogue"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tensorart = "tensorart_api.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tensorart_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
